<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter — Length, Weight, Temperature</title>
<meta name="description" content="Instant length, weight and temperature conversion. 100% in-browser.">
<!-- all page styles live in styles.css -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- the centered page column -->
<div class="wrap">
  <!-- the title and subtitle at the top -->
  <header>
    <h1><span>◈</span> Unit Converter</h1>
    <p>Type a value — conversion is instant. Nothing leaves your browser.</p>
  </header>

  <!-- the category tabs: Length, Weight, Temperature -->
  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="length">Length</div>
    <div class="tab" data-cat="weight">Weight</div>
    <div class="tab" data-cat="temp">Temperature</div>
  </div>

  <!-- the card holding the converter controls -->
  <div class="card">
    <!-- the number input -->
    <label>Value</label>
    <input type="number" id="val" placeholder="0" step="any">
    <!-- the From dropdown, the swap button, and the To dropdown -->
    <div class="swaprow">
      <div class="grow">
        <label>From</label>
        <select id="from"></select>
      </div>
      <button id="swap" title="Swap units">⇄</button>
      <div class="grow">
        <label>To</label>
        <select id="to"></select>
      </div>
    </div>
    <!-- the result box: big answer + the full equation -->
    <div class="result">
      <div class="v" id="out">—</div>
      <div class="f" id="formula"></div>
    </div>
    <!-- the red error line, normally empty -->
    <div class="msg" id="msg"></div>
  </div>

  <!-- the small note at the bottom -->
  <footer>Length &amp; weight convert through SI base units.<br>Temperature converts through Celsius.</footer>
</div>

<!-- all page logic lives in app.js -->
<script src="app.js"></script>
</body>
</html>
